services:

  whatsapp-service:
    build: ./backend/services/whatsapp-service
    container_name: cda-whatsapp
    environment:
      - PORT=3004
    expose:
      - "3004"
    volumes:
      - whatsapp_auth:/app/.wwebjs_auth
    restart: unless-stopped

  contact-service:
    build: ./backend/services/contact-service
    container_name: cda-contact
    env_file: ./backend/services/contact-service/.env
    environment:
      - PORT=3001
      - WHATSAPP_SERVICE_URL=http://whatsapp-service:3004
    expose:
      - "3001"
    depends_on:
      - whatsapp-service
    restart: unless-stopped

  appointment-service:
    build: ./backend/services/appointment-service
    container_name: cda-appointments
    env_file: ./backend/services/appointment-service/.env
    environment:
      - PORT=3002
      - WHATSAPP_SERVICE_URL=http://whatsapp-service:3004
    expose:
      - "3002"
    depends_on:
      - whatsapp-service
    restart: unless-stopped

  chatbot-service:
    build: ./backend/services/chatbot-service
    container_name: cda-chatbot
    environment:
      - PORT=3003
    expose:
      - "3003"
    restart: unless-stopped

  gateway:
    build: ./backend/gateway
    container_name: cda-gateway
    environment:
      - PORT=3000
      - CONTACT_SERVICE_URL=http://contact-service:3001
      - APPOINTMENT_SERVICE_URL=http://appointment-service:3002
      - CHATBOT_SERVICE_URL=http://chatbot-service:3003
    ports:
      - "3000:3000"
    depends_on:
      - contact-service
      - appointment-service
      - chatbot-service
    restart: unless-stopped

volumes:
  whatsapp_auth:
