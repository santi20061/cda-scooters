worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ── Compresión ────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml+rss;

    # ── Zonas de rate limiting ────────────────────────────────────────────────
    # /chat: 5 req/min — protege llamadas a OpenAI
    limit_req_zone $binary_remote_addr zone=zona_chat:10m     rate=5r/m;
    # /contacto: 3 req/min — formulario de contacto
    limit_req_zone $binary_remote_addr zone=zona_contacto:10m rate=3r/m;
    # /stats: 20 req/s — monitoreo general
    limit_req_zone $binary_remote_addr zone=zona_stats:10m    rate=20r/s;

    # ── Upstream API Gateway ─────────────────────────────────────────────────
    upstream api_gateway {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    # ── Upstream Contact Service ──────────────────────────────────────────────
    upstream contact_service {
        server 127.0.0.1:3001;
        keepalive 16;
    }

    # ── Upstream Appointment Service ──────────────────────────────────────────
    upstream appointment_service {
        server 127.0.0.1:3002;
        keepalive 16;
    }

    # ── Upstream Chatbot Service ──────────────────────────────────────────────
    upstream chatbot_service {
        server 127.0.0.1:3003;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 1m;

        # ── Cabeceras de seguridad ────────────────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"                        always;
        add_header X-Content-Type-Options "nosniff"                           always;
        add_header X-XSS-Protection       "1; mode=block"                     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"   always;

        # ── Frontend estático ─────────────────────────────────────────────────
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ── API Gateway: /api ────────────────────────────────────────────────
        location /api {
            limit_req        zone=zona_stats burst=10;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── API Gateway: /chat ────────────────────────────────────────────────
        location /chat {
            limit_req        zone=zona_chat burst=3 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
        }

        # ── API Gateway: /contacto ────────────────────────────────────────────
        location /contacto {
            limit_req        zone=zona_contacto burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── API Gateway: /stats ───────────────────────────────────────────────
        location /stats {
            limit_req        zone=zona_stats burst=10;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── Health Check ──────────────────────────────────────────────────────
        location /health {
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   Connection        "";
            access_log off;
        }
    }
}
