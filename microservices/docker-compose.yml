services:
  api-gateway:
    build:
      context: ./api-gateway
    container_name: cda-api-gateway
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      CONTACT_SERVICE_URL: http://contact-service:3001
      APPOINTMENT_SERVICE_URL: http://appointment-service:3002
      CHATBOT_SERVICE_URL: http://chatbot-service:3003
    depends_on:
      - contact-service
      - appointment-service
      - chatbot-service
    restart: unless-stopped

  contact-service:
    build:
      context: ./contact-service
    container_name: cda-contact-service
    ports:
      - "3001:3001"
    env_file:
      - .env
    restart: unless-stopped

  appointment-service:
    build:
      context: ./appointment-service
    container_name: cda-appointment-service
    ports:
      - "3002:3002"
    env_file:
      - .env
    restart: unless-stopped

  chatbot-service:
    build:
      context: ./chatbot-service
    container_name: cda-chatbot-service
    ports:
      - "3003:3003"
    env_file:
      - .env
    restart: unless-stopped