server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json;

    # Cabeceras de seguridad básicas
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;

    # Archivos estáticos del frontend (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Servir JS con MIME type correcto
    location ~* \.js$ {
        add_header Content-Type application/javascript;
        try_files $uri =404;
    }

    # Proxy de todas las rutas /api al gateway
    # En Docker los contenedores se comunican por nombre de servicio
    location /api/ {
        proxy_pass         https://cda-gateway.onrender.com;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;

        # Reintentos en caso de error de conexión con el gateway
        proxy_next_upstream error timeout;
    }

    # Health check del gateway
    location /health {
        proxy_pass         https://cda-gateway.onrender.com;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        access_log         off;
    }
}
